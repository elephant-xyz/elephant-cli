[package]
name = "elephant-cli"
version = "2.0.0-alpha.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Validate, hash, export, upload, prepare and transform Elephant county data."
repository = "https://github.com/elephant-xyz/elephant-cli"

[[bin]]
name = "elephant-cli"
path = "src/main.rs"

[dependencies]
cid = "0.11"
csv = "1"
clap = { version = "4", features = ["derive", "env"] }
jsonschema = { version = "0.61", default-features = false }
memmap2 = "0.9"
# the allocator of every binary, QuickJS included (ALLOCATOR in src/main.rs): musl's own is slow
mimalloc = "0.1"
parquet = { version = "60", default-features = false, features = ["zstd"] }
regex = "1"
rquickjs = { version = "0.14", features = ["loader", "rust-alloc"] }
ryu-js = "1"
# float_roundtrip: a number read back from canonical bytes is the number that was written
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq = "3"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
parquet = { version = "60", default-features = false, features = ["zstd", "json"] }

[profile.dev]
debug = false
opt-level = 1
