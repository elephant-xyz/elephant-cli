name: Build

# Every commit on v2 gets its binaries, published as the pre-release
# `build-<commit>`, so the current v2 or a pinned commit can be downloaded
# without a Rust toolchain (see "Installation" in the README).
on:
  push:
    branches: ['v2']

permissions:
  contents: read

concurrency:
  group: build-${{ github.sha }}

jobs:
  binaries:
    uses: ./.github/workflows/binaries.yml

  publish:
    name: Publish the commit's binaries
    needs: binaries
    # whatever was built: one platform that fails must not leave the others without a binary
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish build-${{ github.sha }}
        run: |
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          gh release create "build-$GITHUB_SHA" dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Build ${GITHUB_SHA::7}" \
            --notes "Binaries of commit $GITHUB_SHA."
      # a pinned commit older than these is built with cargo
      - name: Keep the newest 50 builds
        run: |
          gh release list --limit 500 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[50:] | .[].tagName' \
            | xargs -r -n 1 gh release delete --yes --cleanup-tag
