name: Binaries

# Builds and tests elephant-cli for every platform it is distributed for and
# uploads one artifact per target: elephant-cli-<target>.tar.gz.
# Called by build.yml (every commit on main) and release.yml (every tag).
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest runner images, so the binaries run on older systems too
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, experimental: false }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, experimental: false }
          - { target: x86_64-apple-darwin, os: macos-latest, experimental: false }
          - { target: aarch64-apple-darwin, os: macos-latest, experimental: false }
          # not yet tested on Windows: a failure here does not stop the others
          - { target: x86_64-pc-windows-msvc, os: windows-latest, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Run the tests
        # the x86_64 macOS binary is cross-built on an arm64 runner
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          binary=elephant-cli
          if [ "${{ runner.os }}" = Windows ]; then binary=elephant-cli.exe; fi
          tar -czf "elephant-cli-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: elephant-cli-${{ matrix.target }}
          path: elephant-cli-${{ matrix.target }}.tar.gz
          if-no-files-found: error
