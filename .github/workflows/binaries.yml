name: Binaries

# Builds and tests elephant-cli for every platform it is distributed for and
# uploads one artifact per target: elephant-cli-<target>.tar.gz.
# Called by build.yml (every commit on v2) and release.yml (every v2 tag).
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest runner images, so the binaries run on older systems too
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          # static: any Linux, among them AWS Lambda (glibc 2.34 and older) and Alpine
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - name: Install the musl C compiler
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "TARGET_CC=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Run the tests
        # the x86_64 macOS binary is cross-built on an arm64 runner
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Start it on the AWS Lambda base image
        if: endsWith(matrix.target, '-musl')
        run: |
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/mnt:ro" \
            --entrypoint /mnt/elephant-cli public.ecr.aws/lambda/provided:al2023 --version
      - name: Pack
        run: tar -czf "elephant-cli-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" elephant-cli
      - uses: actions/upload-artifact@v4
        with:
          name: elephant-cli-${{ matrix.target }}
          path: elephant-cli-${{ matrix.target }}.tar.gz
          if-no-files-found: error
