name: Release

# A release of version 2 is a tag on the v2 branch:
#   git tag v2.0.0-alpha.1 && git push origin v2.0.0-alpha.1
# The tag must equal the version in Cargo.toml. Tags of 1.x (`v1.*`) are cut
# from main by its own workflow and do not start this one.
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build the binaries but publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  binaries:
    uses: ./.github/workflows/binaries.yml

  publish:
    name: Publish
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check that the tag is the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"$" Cargo.toml
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create the GitHub release
        run: |
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          prerelease=""
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          # never "Latest": that is the newest 1.x release, which `releases/latest` and npm users expect
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" \
            --generate-notes --latest=false $prerelease
        env:
          GH_TOKEN: ${{ github.token }}
