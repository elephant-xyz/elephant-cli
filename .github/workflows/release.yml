name: Release

# A release is a tag: `git tag v2.0.0 && git push origin v2.0.0`.
# The tag must equal the version in Cargo.toml and package.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build the binaries but publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest runner images, so the binaries run on older systems too
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, experimental: false }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, experimental: false }
          - { target: x86_64-apple-darwin, os: macos-latest, experimental: false }
          - { target: aarch64-apple-darwin, os: macos-latest, experimental: false }
          # not yet tested on Windows: a failure here does not stop the release
          - { target: x86_64-pc-windows-msvc, os: windows-latest, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Run the tests
        # the x86_64 macOS binary is cross-built on an arm64 runner
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          binary=elephant-cli
          if [ "${{ runner.os }}" = Windows ]; then binary=elephant-cli.exe; fi
          tar -czf "elephant-cli-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: elephant-cli-${{ matrix.target }}
          path: elephant-cli-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check that the tag is the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          grep -q "^version = \"$version\"$" Cargo.toml
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create the GitHub release
        run: |
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          prerelease=""
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes $prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      # npm/install.js reads this file to download the binary instead of building it
      - name: Record the binaries in the npm package
        run: |
          node -e '
            const fs = require("node:fs");
            const sha256 = {};
            for (const line of fs.readFileSync("dist/SHA256SUMS", "utf8").trim().split("\n")) {
              const [sum, file] = line.trim().split(/\s+/);
              sha256[file.replace(/^elephant-cli-/, "").replace(/\.tar\.gz$/, "")] = sum;
            }
            const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GITHUB_REF_NAME}`;
            fs.writeFileSync("npm/release.json", JSON.stringify({ base, sha256 }, null, 2) + "\n");
          '
          cat npm/release.json

      - name: Publish to npm
        run: |
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish --access public --provenance --tag "$tag" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
