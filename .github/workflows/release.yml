name: Release

# A release is a tag: `git tag v2.0.0 && git push origin v2.0.0`.
# The tag must equal the version in Cargo.toml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build the binaries but publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  binaries:
    uses: ./.github/workflows/binaries.yml

  publish:
    name: Publish
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check that the tag is the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"$" Cargo.toml
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create the GitHub release
        run: |
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          prerelease=""
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes $prerelease
        env:
          GH_TOKEN: ${{ github.token }}
