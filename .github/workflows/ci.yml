name: CI

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  OBSCURA_VERSION: v0.2.6

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            obscura: obscura-x86_64-linux-no-render.tar.gz
          - os: macos-latest
            obscura: obscura-aarch64-macos-no-render.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the browser tests of `prepare` are skipped without it
      - name: Install the obscura browser
        run: |
          mkdir -p "$RUNNER_TEMP/obscura"
          curl -fsSL "https://github.com/h4ckf0r0day/obscura/releases/download/$OBSCURA_VERSION/${{ matrix.obscura }}" \
            | tar -xz -C "$RUNNER_TEMP/obscura"
          echo "OBSCURA_BIN=$RUNNER_TEMP/obscura/obscura" >> "$GITHUB_ENV"

      - name: Run the tests
        run: cargo test --locked

      - name: Test the npm launcher and library
        run: node --test tests/sdk.test.mjs
        env:
          ELEPHANT_CLI_BINARY: ${{ github.workspace }}/target/debug/elephant-cli

  # What Atlas and other consumers do: install the package and let it build its binary.
  install:
    name: Install from npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack and install
        run: |
          tarball="$PWD/$(npm pack --silent)"
          mkdir "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          npm init -y > /dev/null
          npm install "$tarball"
      - name: Run the installed command
        working-directory: ${{ runner.temp }}/app
        run: |
          ./node_modules/.bin/elephant-cli --version
          ./node_modules/.bin/elephant-cli --offline --schema-cache "$GITHUB_WORKSPACE/tests/fixtures/lexicon" \
            hash "$GITHUB_WORKSPACE/tests/fixtures/hash/batch/county" \
            --output-zip hashed --output-csv hash.csv --output-car county.car | grep '^CAR written: county.car (20 blocks'
