name: CI

on:
  pull_request:
    # version 2 is developed on `v2`; `main` is here for the pull request that would bring it over
    branches: ['v2', 'main']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  OBSCURA_VERSION: v0.2.6

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.target || matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            obscura: obscura-x86_64-linux-no-render.tar.gz
          # the static binary: build.yml builds it only after the merge
          - os: ubuntu-latest
            obscura: obscura-x86_64-linux-no-render.tar.gz
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            obscura: obscura-aarch64-macos-no-render.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the musl C compiler
        if: matrix.target
        uses: ./.github/actions/musl-cc
      - name: Add the musl target
        if: matrix.target
        run: |
          rustup target add ${{ matrix.target }}
          echo "CARGO_BUILD_TARGET=${{ matrix.target }}" >> "$GITHUB_ENV"
      # the browser tests of `prepare` are skipped without it
      - name: Install the obscura browser
        run: |
          mkdir -p "$RUNNER_TEMP/obscura"
          curl -fsSL "https://github.com/h4ckf0r0day/obscura/releases/download/$OBSCURA_VERSION/${{ matrix.obscura }}" \
            | tar -xz -C "$RUNNER_TEMP/obscura"
          echo "OBSCURA_BIN=$RUNNER_TEMP/obscura/obscura" >> "$GITHUB_ENV"

      - name: Run the tests
        run: cargo test --locked

      - name: Run it on the AWS Lambda base image, with a network
        if: matrix.target
        # what the offline run of binaries.yml leaves out: the lexicon fetched and cached under /tmp,
        # and obscura's no-render build. Exit 1 passes: the lexicon of today may reject the fixture
        run: |
          mkdir -p "$RUNNER_TEMP/site/html/detail" "$RUNNER_TEMP/in"
          echo '<html><body><p>Parcel 12345</p></body></html>' > "$RUNNER_TEMP/site/html/detail/index.html"
          python3 -m http.server 18765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" &
          (cd tests/fixtures/prepare/seed && python3 -m zipfile -c "$RUNNER_TEMP/in/seed.zip" ./*)
          docker run --rm --read-only --tmpfs /tmp --network host --user 993:990 --workdir /tmp \
            -v "$PWD/target/${{ matrix.target }}/debug:/opt/bin:ro" -v "$RUNNER_TEMP/obscura:/opt/obscura:ro" \
            -v "$RUNNER_TEMP/in:/in:ro" -v "$PWD/tests/fixtures/validate/clean:/clean:ro" \
            -e ELEPHANT_SCHEMA_CACHE_DIR=/tmp/schema-cache -e OBSCURA_BIN=/opt/obscura/obscura -e OBSCURA_ALLOW_PRIVATE_NETWORK=1 \
            --entrypoint /bin/sh public.ecr.aws/lambda/provided:al2023 -ec '
              elephant-cli validate /clean --output-csv errors.csv || [ $? = 1 ]
              ELEPHANT_OFFLINE=1 elephant-cli validate /clean --output-csv errors.csv || [ $? = 1 ]
              elephant-cli prepare /in/seed.zip --output-zip prepared.zip --use-browser'
