name: CI

on:
  pull_request:
    # version 2 is developed on `v2`; `main` is here for the pull request that would bring it over
    branches: ['v2', 'main']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  OBSCURA_VERSION: v0.2.6

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.target || matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            obscura: obscura-x86_64-linux-no-render.tar.gz
          # the static binary: build.yml builds it only after the merge
          - os: ubuntu-latest
            obscura: obscura-x86_64-linux-no-render.tar.gz
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            obscura: obscura-aarch64-macos-no-render.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Add the musl target and its C compiler
        if: matrix.target
        run: |
          rustup target add ${{ matrix.target }}
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "TARGET_CC=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_TARGET=${{ matrix.target }}" >> "$GITHUB_ENV"
      # the browser tests of `prepare` are skipped without it
      - name: Install the obscura browser
        run: |
          mkdir -p "$RUNNER_TEMP/obscura"
          curl -fsSL "https://github.com/h4ckf0r0day/obscura/releases/download/$OBSCURA_VERSION/${{ matrix.obscura }}" \
            | tar -xz -C "$RUNNER_TEMP/obscura"
          echo "OBSCURA_BIN=$RUNNER_TEMP/obscura/obscura" >> "$GITHUB_ENV"

      - name: Run the tests
        run: cargo test --locked
