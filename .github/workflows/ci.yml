name: CI

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  OBSCURA_VERSION: v0.2.6

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            obscura: obscura-x86_64-linux-no-render.tar.gz
          - os: macos-latest
            obscura: obscura-aarch64-macos-no-render.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # the browser tests of `prepare` are skipped without it
      - name: Install the obscura browser
        run: |
          mkdir -p "$RUNNER_TEMP/obscura"
          curl -fsSL "https://github.com/h4ckf0r0day/obscura/releases/download/$OBSCURA_VERSION/${{ matrix.obscura }}" \
            | tar -xz -C "$RUNNER_TEMP/obscura"
          echo "OBSCURA_BIN=$RUNNER_TEMP/obscura/obscura" >> "$GITHUB_ENV"

      - name: Run the tests
        run: cargo test --locked
